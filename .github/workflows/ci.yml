# Compilation avec le compilateur Microsoft + autotest de Tech IT AB et PC Santé AB sur un vrai Windows — by alex.b
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Recherche de secrets (gitleaks, commits poussés)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compilation (Roslyn) + bancs de tests
        shell: pwsh
        run: ./build/build.ps1 -Tests
      - name: Tests page Jeu (T15) et authenticité/supervision (T16) sur un vrai Windows
        shell: pwsh
        run: |
          ./out/T15-TechITAB.exe | Tee-Object -FilePath out/t15-techitab.txt; $a = $LASTEXITCODE
          ./out/T15-PCSanteAB.exe | Tee-Object -FilePath out/t15-pcsanteab.txt; $b = $LASTEXITCODE
          ./out/T16-TechITAB.exe | Tee-Object -FilePath out/t16-techitab.txt; $c = $LASTEXITCODE
          ./out/T16-PCSanteAB.exe | Tee-Object -FilePath out/t16-pcsanteab.txt; $d = $LASTEXITCODE
          if ($a -ne 0 -or $b -ne 0 -or $c -ne 0 -or $d -ne 0) { Write-Error "Tests KO — T15: $a/$b, T16: $c/$d"; exit 1 }
      - name: Autotest Tech IT AB (lecture seule)
        shell: pwsh
        run: ./build/selftest.ps1 -Exe out/TechITAB.exe
      - name: Autotest PC Santé AB (lecture seule)
        if: always()
        shell: pwsh
        run: ./build/selftest.ps1 -Exe out/PCSanteAB.exe
      - name: Cloisonnement de PC Santé AB (aucun type sensible dans l'exe)
        shell: powershell
        run: |
          $asm = [Reflection.Assembly]::LoadFile((Resolve-Path out/PCSanteAB.exe).Path)
          try { $types = $asm.GetTypes() } catch [Reflection.ReflectionTypeLoadException] { $types = $_.Exception.Types | Where-Object { $_ } }
          $bad = 'Nmap','Scope','CyberPage','Glpi','Trmm','Multi','Vault','ParcPage','ClientsPage','SecoursPage','AdPage','Rescue','Phish','ScanWatch'
          $found = $types | Where-Object { $_.Namespace -eq 'AmiOps' -and $bad -contains $_.Name }
          if ($found) { Write-Error ("Types sensibles présents : " + ($found.Name -join ', ')); exit 1 }
          'PC Santé AB : aucun type sensible.' 
      - name: Analyse des scripts PowerShell (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path ./build, ./suite/AmiOps/cle-secours -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: techitab-${{ github.sha }}
          path: |
            out/*.exe
            out/SHA256SUMS.txt
            out/autotest-*.txt
            out/t15-*.txt
            out/t16-*.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [secrets-scan, build-test]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Compilation
        shell: pwsh
        run: ./build/build.ps1
      - name: Signature (si le certificat est configuré dans les secrets)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { Write-Host 'Pas de certificat : exe non signés.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $cert = Get-PfxCertificate -FilePath $pfx -Password (ConvertTo-SecureString $env:SIGN_PFX_PASSWORD -AsPlainText -Force)
          Get-ChildItem out -Filter *.exe | ForEach-Object {
            $s = Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert -TimestampServer 'http://timestamp.digicert.com' -HashAlgorithm SHA256
            if ($s.Status -ne 'Valid' -and $s.Status -ne 'UnknownError') { throw "Signature échouée : $($_.Name) ($($s.Status))" }
          }
          Remove-Item $pfx -Force
          Get-ChildItem out -Filter *.exe | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content out/SHA256SUMS.txt -Encoding ascii
      - name: Publication de la version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem out -Filter *.exe).FullName out/SHA256SUMS.txt --generate-notes --title "Tech IT AB / PC Santé AB $env:GITHUB_REF_NAME"
